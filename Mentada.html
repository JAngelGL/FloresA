<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Imagen</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
        }
        img {
            max-width: 80%;
            height: auto;
            border: 5px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        p {
            margin-top: 20px;
            font-size: 2rem;   /* Texto más grande */
            font-weight: bold; /* Texto más grueso */
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Cambia imagen.jpg por tu imagen -->
    <img src="ME.jpg" alt="Mi Imagen">
    <p>IRALA... Bueno, una mentada de madre leve, pero con amor</p>
</body>
</html>
